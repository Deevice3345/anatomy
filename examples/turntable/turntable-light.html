latter carries its rotor magnet, so twelve coils on the chassis push it round directly, while a frequency-generator ring reports the speed back to the quartz servo on the drive board. The strobe flashes 120 times a second, and a row of dots stands still only when the platter turns one dot per flash: 216 dots at 33⅓, 160 at 45, with neighbouring rows for about ±3% on each speed. The layers and figures follow the service manual of the classic direct-drive DJ deck this one is modelled on.</span></figcaption></figure></div><aside class="tt-side" aria-label="Parts"><h2>Parts</h2><p>Bottom to top. Hover a part to pick it out; click to pin it and take the deck apart.</p><ol class="tt-parts"><li><button type="button" class="tt-part" data-part="feet"><span class="tt-num">01</span><span class="tt-name">Insulator feet</span><span class="tt-fig">×4</span><span class="tt-spec"><span>Four large rubber-damped feet carry the deck and soak up shock from the table.</span></span></button></li><li><button type="button" class="tt-part" data-part="base"><span class="tt-num">02</span><span class="tt-name">Rubber base</span><span class="tt-fig"></span><span class="tt-spec"><span>A heavy rubber moulding under the chassis, damping resonance from below.</span></span></button></li><li><button type="button" class="tt-part" data-part="power"><span class="tt-num">03</span><span class="tt-name">Power transformer</span><span class="tt-fig">12 W</span><span class="tt-spec"><span>Steps mains voltage down for the drive and control circuits. The deck draws about 12 W.</span></span></button></li><li><button type="button" class="tt-part" data-part="drive"><span class="tt-num">04</span><span class="tt-name">Drive board</span><span class="tt-fig">0.7 s</span><span class="tt-spec"><span>Quartz oscillator, speed servo and motor driver. It also brakes the platter electronically.</span></span></button></li><li><button type="button" class="tt-part" data-part="operate"><span class="tt-num">05</span><span class="tt-name">Operating board</span><span class="tt-fig">33 · 45</span><span class="tt-spec"><span>Start/stop and the 33 and 45 speed switches.</span></span></button></li><li><button type="button" class="tt-part" data-part="pitch"><span class="tt-num">06</span><span class="tt-name">Pitch control</span><span class="tt-fig">±8%</span><span class="tt-spec"><span>A slide control on its own bracket: ±8% around either speed, still under quartz control.</span></span></button></li><li><button type="button" class="tt-part" data-part="chassis"><span class="tt-num">07</span><span class="tt-name">Die-cast chassis</span><span class="tt-fig">Al</span><span class="tt-spec"><span>Aluminium die-cast top that carries the motor, arm and controls.</span></span></button></li><li><button type="button" class="tt-part" data-part="strobe"><span class="tt-num">08</span><span class="tt-name">Strobe illuminator</span><span class="tt-fig">120 /s</span><span class="tt-spec"><span>An LED flashing in step with the quartz clock, aimed at the platter rim.</span></span></button></li><li><button type="button" class="tt-part" data-part="motor"><span class="tt-num">09</span><span class="tt-name">Stator and FG coil</span><span class="tt-fig">1.5 kg·cm</span><span class="tt-spec"><span>Twelve coils of a brushless DC motor, with a frequency-generator ring that reports speed. 1.5 kg·cm starting torque.</span></span></button></li><li><button type="button" class="tt-part" data-part="platter"><span class="tt-num">10</span><span class="tt-name">Platter and rotor</span><span class="tt-fig">33.2 cm</span><span class="tt-spec"><span>Aluminium die-cast, 33.2 cm across, about 2 kg, with the rotor magnet underneath and strobe dots on the rim. Up to speed in 0.7 s.</span></span></button></li><li><button type="button" class="tt-part" data-part="mat"><span class="tt-num">11</span><span class="tt-name">Rubber mat</span><span class="tt-fig"></span><span class="tt-spec"><span>A thick rubber mat between platter and record damps
